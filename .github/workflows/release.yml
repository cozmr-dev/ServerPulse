name: Release

# Startet bei jedem Versions-Tag, z. B.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build universal app and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          VERSION="${VERSION}" ./build.sh dmg

      - name: Generate Homebrew cask
        run: scripts/make-cask.sh "$VERSION" "$GITHUB_REPOSITORY" > build/serverpulse.rb

      - name: Write release notes
        run: |
          SHA256="$(cut -d' ' -f1 "build/ServerPulse-${VERSION}.dmg.sha256")"
          cat > build/release-notes.md <<NOTES
          ## Install

          1. Download **ServerPulse-${VERSION}.dmg** below and drag ServerPulse into Applications.
          2. ServerPulse is not notarized by Apple. On first launch, open **System Settings → Privacy & Security** and click **Open Anyway**.

          Or with Homebrew:

          \`\`\`
          brew install --cask ${GITHUB_REPOSITORY_OWNER}/tap/serverpulse
          \`\`\`

          Universal build for Apple Silicon and Intel · macOS 14 Sonoma or later.

          **SHA-256** \`${SHA256}\`

          This DMG was built by GitHub Actions from commit ${GITHUB_SHA} – see the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/ServerPulse-${VERSION}.dmg" \
            "build/ServerPulse-${VERSION}.dmg.sha256" \
            build/serverpulse.rb \
            --title "ServerPulse ${VERSION}" \
            --notes-file build/release-notes.md \
            --verify-tag
