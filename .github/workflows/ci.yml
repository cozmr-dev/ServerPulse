name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build app
        run: ./build.sh
